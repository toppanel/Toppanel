# Decap CMS config — served at /admin. Edits here go straight to the
# src/content/*.json files that the site's pages import at build time,
# which the self-hosted runner then builds and FTP-deploys automatically.
#
# TODO once the OAuth relay is deployed to Vercel: replace `base_url`
# below with that deployment's URL (see CMS_SETUP.md).

backend:
  name: github
  repo: toppanel/Toppanel
  branch: main
  base_url: https://REPLACE-WITH-YOUR-VERCEL-OAUTH-RELAY.vercel.app
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "홈페이지"
    files:
      - name: "hero"
        label: "히어로 슬라이드"
        file: "src/content/homepage.json"
        fields:
          - label: "슬라이드"
            name: "heroSlides"
            widget: "list"
            fields:
              - { label: "이미지", name: "src", widget: "image" }
              - { label: "대체 텍스트(alt)", name: "alt", widget: "string" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "부제목", name: "sub", widget: "string" }

  - name: "about"
    label: "회사소개 페이지"
    files:
      - name: "about"
        label: "회사소개 콘텐츠"
        file: "src/content/about.json"
        fields:
          - label: "상단 헤더"
            name: "header"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "부제목", name: "subtitle", widget: "text" }
              - { label: "배경 이미지", name: "image", widget: "image", required: false, media_folder: "public/images/page-headers", public_folder: "/images/page-headers" }
          - label: "브랜드 철학"
            name: "philosophy"
            widget: "object"
            fields:
              - { label: "제목", name: "heading", widget: "string" }
              - label: "항목"
                name: "items"
                widget: "list"
                fields:
                  - { label: "번호", name: "num", widget: "string" }
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "본문", name: "body", widget: "text" }
          - label: "공간 솔루션"
            name: "solution"
            widget: "object"
            fields:
              - { label: "제목", name: "heading", widget: "string" }
              - label: "항목"
                name: "items"
                widget: "list"
                fields:
                  - { label: "이름", name: "label", widget: "string" }
                  - { label: "본문", name: "body", widget: "text" }
          - label: "인증/특허"
            name: "certifications"
            widget: "list"
            fields:
              - { label: "이름", name: "label", widget: "string" }
              - { label: "설명", name: "sub", widget: "string" }
              - { label: "배지", name: "badge", widget: "string" }
              - { label: "인증서 파일 (이미지 또는 PDF)", name: "file", widget: "file", required: false, media_folder: "public/images/certifications", public_folder: "/images/certifications" }
          - label: "생산 설비"
            name: "equipment"
            widget: "list"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }

  - name: "contact"
    label: "문의하기 페이지"
    files:
      - name: "contact"
        label: "문의하기 콘텐츠"
        file: "src/content/contact.json"
        fields:
          - label: "상단 헤더"
            name: "header"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "부제목", name: "subtitle", widget: "text" }
              - { label: "배경 이미지", name: "image", widget: "image", required: false, media_folder: "public/images/page-headers", public_folder: "/images/page-headers" }
          - { label: "운영 시간", name: "hours", widget: "string" }
          - { label: "견적 문의 이메일", name: "quoteEmail", widget: "string" }
          - { label: "대리점 문의 이메일", name: "dealerEmail", widget: "string" }
          - { label: "카카오 채널 URL", name: "kakaoChannelUrl", widget: "string" }
          - { label: "카카오 안내", name: "kakaoHours", widget: "string" }
          - label: "오시는 길"
            name: "directions"
            widget: "object"
            fields:
              - { label: "주소", name: "address", widget: "string" }
              - { label: "안내", name: "note", widget: "string" }
          - label: "자주 묻는 질문"
            name: "faq"
            widget: "list"
            fields:
              - { label: "질문", name: "q", widget: "string" }
              - { label: "답변", name: "a", widget: "text" }

  - name: "products"
    label: "제품 카탈로그"
    files:
      - name: "products"
        label: "제품 카탈로그 데이터"
        file: "src/content/products.json"
        fields:
          - label: "카테고리"
            name: "categories"
            widget: "list"
            summary: "{{fields.label}} ({{fields.slug}})"
            fields:
              - { label: "슬러그 (URL용 값 — 절대 변경 금지)", name: "slug", widget: "string" }
              - { label: "분류명 (국문)", name: "label", widget: "string" }
              - { label: "분류명 (영문)", name: "labelSub", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }
              - { label: "대표 이미지", name: "image", widget: "image", required: false, media_folder: "public/images/products", public_folder: "/images/products" }
              - label: "예비 이미지 (모델별 사진이 없을 때 대신 보여줄 사진들)"
                name: "fallbackImages"
                widget: "list"
                required: false
                field: { label: "이미지", name: "image", widget: "image", media_folder: "public/images/products", public_folder: "/images/products" }
              - label: "모델"
                name: "models"
                widget: "list"
                summary: "{{fields.code}} — {{fields.nameKo}}"
                fields:
                  - { label: "슬러그 (URL용 값 — 절대 변경 금지)", name: "slug", widget: "string" }
                  - { label: "모델 코드", name: "code", widget: "string" }
                  - { label: "모델 코드 (보조, 있는 경우만)", name: "codeS", widget: "string", required: false }
                  - { label: "모델명 (영문)", name: "name", widget: "string" }
                  - { label: "모델명 (국문)", name: "nameKo", widget: "string" }
                  - label: "사진 (첫 번째 사진이 대표 사진)"
                    name: "images"
                    widget: "list"
                    required: false
                    field: { label: "이미지", name: "image", widget: "image", media_folder: "public/images/products", public_folder: "/images/products" }

  - name: "company"
    label: "회사 정보"
    files:
      - name: "company"
        label: "회사 기본 정보"
        file: "src/content/company.json"
        fields:
          - { label: "회사명(국문)", name: "name", widget: "string" }
          - { label: "회사명(영문)", name: "nameEn", widget: "string" }
          - { label: "대표자", name: "ceo", widget: "string" }
          - { label: "사무실 주소", name: "officeAddress", widget: "string" }
          - { label: "공장 주소", name: "factoryAddress", widget: "string" }
          - { label: "전화번호", name: "phone", widget: "string" }
          - { label: "팩스", name: "fax", widget: "string" }
          - { label: "이메일", name: "email", widget: "string" }
          - { label: "카카오 채널", name: "kakao", widget: "string" }
          - { label: "사업자등록번호", name: "businessNumber", widget: "string" }

  - name: "downloads"
    label: "다운로드 자료실"
    files:
      - name: "downloads"
        label: "다운로드 콘텐츠"
        file: "src/content/downloads.json"
        fields:
          - label: "상단 헤더"
            name: "header"
            widget: "object"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "부제목", name: "subtitle", widget: "text" }
              - { label: "배경 이미지", name: "image", widget: "image", required: false, media_folder: "public/images/page-headers", public_folder: "/images/page-headers" }
          - label: "파일 목록"
            name: "files"
            widget: "list"
            fields:
              - label: "분류"
                name: "category"
                widget: "select"
                options: ["도면", "시방서", "카탈로그", "시험성적서", "인증", "설치매뉴얼"]
              - { label: "파일명", name: "name", widget: "string" }
              - { label: "설명", name: "desc", widget: "string" }
              - { label: "용량", name: "size", widget: "string" }
              - { label: "업데이트", name: "updated", widget: "string" }
              - { label: "다운로드 파일", name: "file", widget: "file", required: false, media_folder: "public/downloads", public_folder: "/downloads" }
